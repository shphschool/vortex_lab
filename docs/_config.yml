title: Vortex Lab
description: Documentation for Vortex Lab.
theme: just-the-docs

# GitHub Pages URL settings
url: "https://shphschool.github.io"
baseurl: "/vortex_lab"

# Auxiliary links (top right corner)
aux_links:
  "Vortex Lab on GitHub":
    - "https://github.com/shphschool/vortex_lab"
aux_links_new_tab: true

# Navigation settings
nav_sort: case_insensitive
heading_anchors: true

# Search settings
search_enabled: true
search:
  heading_level: 2
  previews: 3

# Color scheme (nil allows light/dark system preference detection)
color_scheme: nil

# Callouts configuration
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: purple
